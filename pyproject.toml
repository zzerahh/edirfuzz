[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edirfuzz"
version = "1.0.0"
description = "Enhanced Directory Fuzzer with real-time and adaptive request-rate control"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "rich",
    "flask"
]

[project.scripts]
edirfuzz = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]